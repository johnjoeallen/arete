spring.application.name=arete
server.port=6809

# Pasted specs are submitted as a single application/x-www-form-urlencoded
# field; Tomcat's 2MB default form-POST size is too small for large specs.
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# Maximum YAML/OpenAPI document size accepted by swagger-parser.
arete.openapi.max-document-size=50MB

spring.datasource.url=jdbc:h2:file:${user.home}/.arete/data/arete;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Drop folder: files placed here are loaded and watched for changes automatically.
arete.specs-dir=${user.home}/.arete/specs

# Drop folder for validator plugin jars, loaded at startup.
arete.plugins-dir=${user.home}/.arete/plugins

# Deployment mode: 'local' (single user) or 'shared' (multi-user / networked).
# 'shared' disables /api/load-file, the drop-folder watcher, and file: URLs,
# and forces the automation API's SSRF guard on. See docs/automation-api.md.
arete.deployment.mode=local
