<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${openApi != null and openApi.info != null and openApi.info.title != null} ? ${openApi.info.title} : 'Areté'">Areté</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <script>
        (function () {
            var saved = localStorage.getItem('openapi-viewer:theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(${specs}, ${q}, ${specId})}"></div>
<div class="main">
    <nav id="tab-bar" class="tab-bar" th:attr="data-spec-id=${specId},data-spec-title=${specTitle}"></nav>
    <div class="main-content">

    <div th:if="${parseErrors != null and !parseErrors.isEmpty()}" class="parse-errors">
        <h2>Parse messages</h2>
        <ul>
            <li th:each="msg : ${parseErrors}" th:text="${msg}"></li>
        </ul>
    </div>

    <div th:if="${openApi == null}">
        <p>Could not parse the pasted spec.</p>
    </div>

    <div th:if="${openApi != null}">
        <h1 th:text="${openApi.info != null and openApi.info.title != null} ? ${openApi.info.title} : '(untitled)'">Spec title</h1>
        <p th:if="${openApi.info != null and openApi.info.version != null}">
            <strong>Version:</strong> <span th:text="${openApi.info.version}"></span>
        </p>
        <p th:if="${specFilePath != null}" class="spec-source-line">
            <strong>Loaded from:</strong> <code th:text="${specFilePath}"></code>
        </p>
        <p th:if="${specNamespace != null}" class="spec-source-line">
            <span class="spec-badge">namespace: <code th:text="${specNamespace}"></code></span>
            <span class="spec-badge">submitted by: <code th:text="${specSubmitter}"></code></span>
        </p>
        <div th:if="${openApi.info != null and openApi.info.description != null}" th:with="renderedDescription=${@markdownRenderer.render(openApi.info.description)}" class="markdown-body" th:utext="${renderedDescription}"></div>

        <div class="tabset top-level-tabset explore-score-tabset">
            <div class="tabset-nav">
                <button type="button" class="tab-btn" th:classappend="${!activateScore} ? ' active'">Explore</button>
                <button type="button" class="tab-btn" th:classappend="${activateScore} ? ' active'">Score</button>
            </div>
            <div class="tabset-panels">
                <div class="tab-panel" th:classappend="${!activateScore} ? ' active'">
                    <div th:replace="~{fragments/specbody :: specBody(${tagGroups}, ${componentSchemas}, ${componentRequestBodies}, ${componentResponses}, ${generalFindings}, ${endpointFindings}, ${schemaFindings}, ${requestBodyFindings}, ${responseFindings}, ${severityLabels}, 'viewer')}"></div>
                </div>

                <div class="tab-panel" th:classappend="${activateScore} ? ' active'">
                    <div th:if="${engineChoices != null and !engineChoices.isEmpty() and specRef != null}" class="scoring-picker-wrapper">
                        <h2>Scoring</h2>
                        <form method="post" th:action="@{/spec/{ref}/score(ref=${specRef})}" class="scoring-picker" id="scoring-picker-form">
                            <table class="engine-picker-table">
                                <thead>
                                    <tr><th></th><th>Engine</th><th>Policy</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="pc : ${engineChoices}">
                                        <td><input type="checkbox" name="engine" th:value="${pc.engineId()}" th:checked="${pc.enabled()}"></td>
                                        <td th:text="${pc.engineName()}"></td>
                                        <td>
                                            <select th:name="'policy_' + ${pc.engineId()}">
                                                <option th:each="rs : ${pc.policies()}" th:value="${rs.slug()}" th:text="${rs.name()}"
                                                        th:selected="${rs.slug() == pc.selectedSlug()}"></option>
                                            </select>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <button type="submit">Score</button>
                        </form>
                    </div>

                    <div class="score-lower-panel">
                        <div th:if="${!hasBeenScored}" class="score-empty-state" role="img" aria-label="No analysis results">
                            <span class="score-empty-icon">&#128683;</span>
                            <p>Score this to see scoring results.</p>
                        </div>

                        <div th:if="${hasBeenScored}">
                            <div class="scoring-results">
                                <p th:if="${resultFromCache}" class="scoring-summary-line scoring-cached-note">Showing results from the last Score run.</p>
                                <p th:if="${scoring.rulesEvaluatedCount() >= 0}" class="scoring-summary-line"
                                   th:text="${scoring.rulesEvaluatedCount()} + ' rule(s) checked across ' + ${scoring.engineSummaries().size()} + ' validator(s).'"></p>
                                <p th:if="${!T(java.lang.Double).isNaN(scoring.overallScore())}" class="scoring-summary-line scoring-score-line">
                                    Score: <span th:text="${#numbers.formatDecimal(scoring.overallScore(), 1, 1)}"></span>%
                                    <span th:if="${scoring.grade() != null}" class="scoring-grade"
                                          th:text="'&nbsp;Grade ' + ${scoring.grade()}"></span>
                                    <span th:if="${!T(java.lang.Double).isNaN(scoring.passingScore())}"
                                          th:classappend="${scoring.meetsPassingScore()} ? ' scoring-pass' : ' scoring-fail'"
                                          th:text="${scoring.meetsPassingScore()}
                                              ? '&nbsp;— passes (≥ ' + ${#numbers.formatDecimal(scoring.passingScore(),0,0)} + ')'
                                              : '&nbsp;— below passing score of ' + ${#numbers.formatDecimal(scoring.passingScore(),0,0)}"></span>
                                    <span th:if="${!T(java.lang.Double).isNaN(scoring.overallScoreWithoutBlockers()) and scoring.overallScore() != scoring.overallScoreWithoutBlockers()}"
                                          th:text="' (' + ${#numbers.formatDecimal(scoring.overallScoreWithoutBlockers(), 1, 1)} + '% without blockers)'"></span>
                                </p>
                                <p th:if="${scoring.diagnostics().isEmpty()}" class="scoring-summary-line scoring-clean-note">No issues found.</p>
                                <ul class="engine-outcomes">
                                    <li th:each="s : ${scoring.engineSummaries()}">
                                        <span th:text="${s.engineName()}"></span>:
                                        <span th:if="${s.status() == 'SUCCESS'}" th:text="${s.diagnosticCount()} + ' diagnostic(s)'"></span>
                                        <span th:unless="${s.status() == 'SUCCESS'}" class="engine-error" th:text="${s.status()} + ' - ' + ${s.errorMessage()}"></span>
                                    </li>
                                </ul>
                                <div class="severity-filter">
                                    <label class="severity-filter-item severity-filter-item-all">
                                        <input type="checkbox" class="severity-filter-all" checked>
                                        All
                                    </label>
                                    <label class="severity-filter-item" th:each="sev : ${T(net.dublinux.arete.engine.api.Severity).values()}">
                                        <input type="checkbox" class="severity-filter-value" th:value="${sev.name()}" checked>
                                        <span th:text="${severityLabels.get(sev.name())}">Error</span>
                                        <th:block th:if="${severityScoreImpact != null and severityScoreImpact.containsKey(sev.name())}"
                                                  th:with="severityImpactStr=${#numbers.formatDecimal(-severityScoreImpact.get(sev.name()), 1, 1)}">
                                            <span th:if="${severityImpactStr != '0.0' and severityImpactStr != '-0.0'}"
                                                  class="severity-score-impact"
                                                  th:text="${severityImpactStr} + '%'"></span>
                                        </th:block>
                                    </label>
                                    <label class="severity-filter-item">
                                        <input type="checkbox" class="severity-filter-value" value="COMPLIANT" checked>
                                        Compliant
                                    </label>
                                </div>
                            </div>

                            <div th:replace="~{fragments/specbody :: specBody(${tagGroups}, ${componentSchemas}, ${componentRequestBodies}, ${componentResponses}, ${generalFindings}, ${endpointFindings}, ${schemaFindings}, ${requestBodyFindings}, ${responseFindings}, ${severityLabels}, 'analyser')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
<script th:src="@{/js/tabs.js}" src="/js/tabs.js" defer></script>
<script th:src="@{/js/sidebar-refresh.js}" src="/js/sidebar-refresh.js" defer></script>
<script th:src="@{/js/interactivity.js}" src="/js/interactivity.js" defer></script>
<script th:src="@{/js/theme.js}" src="/js/theme.js" defer></script>
</body>
</html>
