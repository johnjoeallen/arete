<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Settings - Areté</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <script>
        (function () {
            var saved = localStorage.getItem('openapi-viewer:theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(${specs}, ${q}, null)}"></div>
<div class="main">
    <nav id="tab-bar" class="tab-bar"></nav>
    <div class="main-content">
        <h1>Settings</h1>

        <h3>Validator plugins</h3>
        <p th:if="${pluginRows.isEmpty()}" class="muted">
            No validation plugins are loaded. Drop a plugin jar into <code th:text="${installPluginsDir}"></code>
            or <code th:text="${userPluginsDir}"></code> and restart.
        </p>
        <table class="plugin-settings" th:if="${!pluginRows.isEmpty()}">
            <thead>
                <tr><th>Plugin</th><th>ID</th><th>Status</th></tr>
            </thead>
            <tbody>
                <tr th:each="row : ${pluginRows}">
                    <td th:text="${row.name()}">Plugin name</td>
                    <td><code th:text="${row.id()}">plugin-id</code></td>
                    <td>
                        <form method="post" th:action="@{/settings/plugins/{id}/toggle(id=${row.id()})}">
                            <button type="submit" class="plugin-toggle-btn" th:classappend="${row.enabled()} ? ' is-enabled' : ' is-disabled'">
                                <span th:text="${row.enabled()} ? 'Enabled' : 'Disabled'">Enabled</span>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/js/tabs.js" defer></script>
<script src="/js/sidebar-refresh.js" defer></script>
<script src="/js/theme.js" defer></script>
</body>
</html>
