name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: mvn --no-transfer-progress versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build
        run: mvn --no-transfer-progress verify

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/speculate/plugins
          cp speculate-app/target/speculate-${VERSION}.jar dist/speculate/speculate.jar
          cp scripts/speculate.sh dist/speculate/
          cp scripts/speculate.bat dist/speculate/
          cp zally-validation-plugin/target/zally-validation-plugin-${VERSION}.jar dist/speculate/plugins/zally-validation-plugin.jar
          chmod +x dist/speculate/speculate.sh
          ZIP="$(pwd)/speculate-${VERSION}.zip"
          (cd dist && zip -r "$ZIP" speculate)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            speculate-${GITHUB_REF_NAME#v}.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # The two steps below only run once MAVEN_CENTRAL_USERNAME is set as a
      # repo secret — until then they're skipped, so this workflow works
      # exactly as before with no Central account configured. See README's
      # Custom Validation section for the one-time account/secrets setup.
      - name: Import GPG key
        if: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish speculate-validation-spi to Maven Central
        if: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
          mvn --no-transfer-progress -pl speculate-validation-spi -Prelease deploy
          echo "Uploaded to Central Portal — review and publish manually at https://central.sonatype.com/publishing/deployments"
