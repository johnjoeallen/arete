name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        # No -DprocessAllModules: that would also rewrite the arete-ci-gate-*
        # modules, which version independently (1.x, ci-gate-v* tags). Without
        # it, versions:set only touches modules sharing the old version.
        run: mvn --no-transfer-progress versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build
        run: mvn --no-transfer-progress verify

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/arete/plugins
          cp arete-app/target/arete-${VERSION}.jar dist/arete/arete.jar
          cp scripts/arete.sh dist/arete/
          cp scripts/arete.bat dist/arete/
          cp arete-policy-plugin/target/arete-policy-plugin-${VERSION}.jar dist/arete/plugins/arete-policy-plugin.jar
          chmod +x dist/arete/arete.sh
          ZIP="$(pwd)/arete-${VERSION}.zip"
          (cd dist && zip -r "$ZIP" arete)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            arete-${GITHUB_REF_NAME#v}.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Publishing arete-scoring-spi to Maven Central is NOT part of
      # this workflow — it doesn't belong on every tag push. See
      # publish-spi.yml, triggered by hand from the Actions tab against a
      # specific tag once that release is ready to be published externally.

  docs:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
