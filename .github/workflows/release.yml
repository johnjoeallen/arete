name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: mvn --no-transfer-progress versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build
        run: mvn --no-transfer-progress package -DskipTests

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/speculate
          cp target/openapi-viewer-${VERSION}.jar dist/speculate/speculate.jar
          cp scripts/speculate.sh dist/speculate/
          cp scripts/speculate.bat dist/speculate/
          chmod +x dist/speculate/speculate.sh
          ZIP="$(pwd)/speculate-${VERSION}.zip"
          (cd dist && zip -r "$ZIP" speculate)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            speculate-${GITHUB_REF_NAME#v}.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
