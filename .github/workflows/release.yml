name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        # -DprocessAllModules is required: arete-scoring-spi, arete-policy-plugin
        # and arete-app carry an explicit <version> and do not declare
        # arete-parent as their <parent> (arete-app parents to Spring Boot), so
        # without it versions:set never reaches them and the packaged jars keep
        # the SNAPSHOT name. It also stamps the arete-ci-gate-* modules with this
        # tag's version, which is harmless here — this workflow neither zips nor
        # publishes them, and their real releases run from ci-gate-v* tags via
        # publish-ci-gate.yml, which sets their version itself.
        run: mvn --no-transfer-progress versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build
        run: mvn --no-transfer-progress verify

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/arete/plugins
          cp arete-app/target/arete-${VERSION}.jar dist/arete/arete.jar
          cp scripts/arete.sh dist/arete/
          cp scripts/arete.bat dist/arete/
          cp arete-policy-plugin/target/arete-policy-plugin-${VERSION}.jar dist/arete/plugins/arete-policy-plugin.jar
          chmod +x dist/arete/arete.sh
          ZIP="$(pwd)/arete-${VERSION}.zip"
          (cd dist && zip -r "$ZIP" arete)

      - name: Package Distill editor bundle
        # editors/distill/ is a self-contained TextMate grammar / VS Code
        # extension — static files, no build. Ship it two ways: a plain zip for
        # IntelliJ's "TextMate Bundles" import and manual installs, and a .vsix
        # (itself a zip) for `code --install-extension`. Versioned by the
        # extension's own package.json, not the Areté tag.
        run: |
          EXT_VERSION=$(node -p "require('./editors/distill/package.json').version")
          cp LICENSE editors/distill/LICENSE
          (cd editors && zip -r "$GITHUB_WORKSPACE/distill-syntax-${EXT_VERSION}.zip" distill \
            -x 'distill/node_modules/*' 'distill/*.vsix' 'distill/.gitignore' 'distill/.vscodeignore')
          (cd editors/distill && npx --yes @vscode/vsce package --no-dependencies \
            -o "$GITHUB_WORKSPACE/distill-syntax-${EXT_VERSION}.vsix")
          echo "EXT_VERSION=${EXT_VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            arete-${GITHUB_REF_NAME#v}.zip \
            distill-syntax-${EXT_VERSION}.zip \
            distill-syntax-${EXT_VERSION}.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Publishing arete-scoring-spi to Maven Central is NOT part of
      # this workflow — it doesn't belong on every tag push. See
      # publish-spi.yml, triggered by hand from the Actions tab against a
      # specific tag once that release is ready to be published externally.

  docs:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
