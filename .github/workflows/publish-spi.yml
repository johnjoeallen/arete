name: Publish SPI to Maven Central

# Deliberately workflow_dispatch-only, never on a tag push: publishing
# arete-validation-spi to Central is a one-off, reviewed action for a
# release that's meant to be depended on externally, not something every
# tagged release should trigger automatically. Run from the Actions tab,
# pointing at the tag to publish; the upload still lands as a pending
# deployment at central.sonatype.com/publishing/deployments for manual
# review (autoPublish is off — see arete-validation-spi/pom.xml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish arete-validation-spi from (e.g. v0.99.11)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: mvn --no-transfer-progress versions:set -DnewVersion=${TAG#v} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish arete-validation-spi to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.m2
          {
            echo '<settings>'
            echo '  <servers>'
            echo '    <server>'
            echo '      <id>central</id>'
            echo "      <username>${MAVEN_CENTRAL_USERNAME}</username>"
            echo "      <password>${MAVEN_CENTRAL_PASSWORD}</password>"
            echo '    </server>'
            echo '  </servers>'
            echo '</settings>'
          } > ~/.m2/settings.xml
          mvn --no-transfer-progress -pl arete-validation-spi -Prelease deploy
          echo "Uploaded to Central Portal — review and publish manually at https://central.sonatype.com/publishing/deployments"
