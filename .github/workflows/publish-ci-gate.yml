name: Publish CI Gate to Maven Central

# Modelled on publish-spi.yml: workflow_dispatch-only, pointed at a
# ci-gate-v* tag. Publishes arete-ci-gate-core, arete-ci-gate-maven-plugin
# and arete-ci-gate-gradle-plugin. The upload lands as a pending deployment
# at central.sonatype.com/publishing/deployments for manual review
# (autoPublish is off — see the release profile in the parent pom).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the CI Gate from (e.g. ci-gate-v1.0.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set CI Gate version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#ci-gate-v}"
          for m in arete-ci-gate-core arete-ci-gate-maven-plugin arete-ci-gate-gradle-plugin; do
            mvn --no-transfer-progress -q -pl "$m" versions:set \
              -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          done

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.m2
          {
            echo '<settings><servers><server>'
            echo '  <id>central</id>'
            echo "  <username>${MAVEN_CENTRAL_USERNAME}</username>"
            echo "  <password>${MAVEN_CENTRAL_PASSWORD}</password>"
            echo '</server></servers></settings>'
          } > ~/.m2/settings.xml
          mvn --no-transfer-progress -Prelease \
            -pl arete-ci-gate-core,arete-ci-gate-maven-plugin,arete-ci-gate-gradle-plugin \
            deploy
          echo "Uploaded — review and publish at https://central.sonatype.com/publishing/deployments"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --generate-notes
