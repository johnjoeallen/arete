spring.application.name=speculate
server.port=6809

# Pasted specs are submitted as a single application/x-www-form-urlencoded
# field; Tomcat's 2MB default form-POST size is too small for large specs.
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

spring.datasource.url=jdbc:h2:file:${user.home}/.speculate/data/speculate;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Drop folder: files placed here are loaded and watched for changes automatically.
speculate.specs-dir=${user.home}/.speculate/specs

# Drop folder for validator plugin jars, loaded at startup.
speculate.plugins-dir=${user.home}/.speculate/plugins
