# Profile for manual/agent live verification (`SPRING_PROFILES_ACTIVE=test mvn
# spring-boot:run`) — points at a throwaway database instead of the real
# ~/.speculate/data/speculate used by an actual installed/running instance,
# so exploratory testing (including schema changes) can never touch or
# corrupt a real user's saved specs.
spring.datasource.url=jdbc:h2:file:${java.io.tmpdir}/speculate-live-check;AUTO_SERVER=TRUE

# Same isolation for the drop folder the file watcher scans and loads from at
# startup: never let a live check see or load the real ~/.speculate/specs.
speculate.specs-dir=${java.io.tmpdir}/speculate-live-check-specs

# ...and for the plugin jar drop folder, so a live check never loads a real plugin either.
speculate.plugins-dir=${java.io.tmpdir}/speculate-live-check-plugins
