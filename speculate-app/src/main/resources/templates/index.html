<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Speculate</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <script>
        (function () {
            var saved = localStorage.getItem('openapi-viewer:theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(${specs}, ${q}, null)}"></div>
<div class="main">
    <nav id="tab-bar" class="tab-bar"></nav>
    <div class="main-content">
        <h1>Speculate</h1>

        <p class="drop-folder-hint">Drop a spec file into <code th:text="${specsDir}"></code> and Speculate will load it and watch it for changes.</p>

        <p class="paste-divider">or load a file from elsewhere on disk (Speculate will watch it for changes)</p>
        <form method="post" action="/api/load-file" class="load-file-form">
            <div class="load-file-row">
                <input type="text" name="filePath" id="load-file-path" placeholder="/absolute/path/to/spec.yaml">
                <button type="submit">Load &amp; watch</button>
            </div>
        </form>

        <p class="paste-divider">or paste an OpenAPI/Swagger definition (JSON or YAML) below</p>
        <form method="post" action="/api/paste">
            <textarea name="specText" rows="20" cols="100" placeholder="Paste your OpenAPI/Swagger spec here..."></textarea>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
<script src="/js/tabs.js" defer></script>
<script src="/js/sidebar-refresh.js" defer></script>
<script src="/js/theme.js" defer></script>
</body>
</html>
