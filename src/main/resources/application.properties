spring.application.name=openapi-viewer
server.port=6809

# Pasted specs are submitted as a single application/x-www-form-urlencoded
# field; Tomcat's 2MB default form-POST size is too small for large specs.
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

spring.datasource.url=jdbc:h2:file:./data/openapi-viewer;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
