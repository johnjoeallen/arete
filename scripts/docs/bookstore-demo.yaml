openapi: 3.0.3
info:
  title: Bookstore API
  version: 1.2.0
  description: A small demo API for managing a bookstore's catalog and orders.
servers:
  - url: https://api.example.com/v1
tags:
  - name: Books
    description: Browse and manage the catalog.
  - name: Orders
    description: Place and review orders.
paths:
  /books:
    get:
      tags: [Books]
      summary: List books
      operationId: listBooks
      parameters:
        - name: author
          in: query
          required: false
          description: Filter by author name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
      responses:
        '200':
          description: A page of books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags: [Books]
      summary: Add a book
      operationId: addBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: The created book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
  /books/{bookId}:
    get:
      tags: [Books]
      summary: Get a book
      operationId: getBook
      parameters:
        - name: bookId
          in: path
          required: true
          description: Identifier of the book.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: No book with that identifier.
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    Book:
      type: object
      description: A single catalogue entry.
      required: [id, title, author]
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier.
        title:
          type: string
          description: Book title.
        author:
          type: string
          description: Primary author.
        publishedYear:
          type: integer
          description: Year of first publication.
        listPrice:
          type: number
          description: Retail price in USD.
        Format:
          type: integer
          description: Binding format, 1 = hardback, 2 = paperback.
          enum: [1, 2]
    Order:
      type: object
      required: [id, bookIds]
      properties:
        id:
          type: string
          format: uuid
        bookIds:
          type: array
          items:
            type: string
            format: uuid
        placed_at:
          type: string
          format: date-time
          description: When the order was placed.
        status:
          type: string
          enum: [pending, shipped, delivered]
