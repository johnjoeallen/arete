openapi: 3.0.3
info:
  title: Widget API
  version: 1.0.0
  description: A tiny sample spec for exercising the Areté automation API.
servers:
  - url: https://api.example.com/v1
paths:
  /widgets:
    get:
      summary: List widgets
      operationId: listWidgets
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetList' }
    post:
      summary: Create a widget
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Widget' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
  /widgets/{widgetId}:
    get:
      summary: Fetch a widget
      operationId: getWidget
      parameters:
        - { name: widgetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
components:
  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    WidgetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Widget' }
