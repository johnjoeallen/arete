openapi: 3.0.3
info:
  title: Orders API
  description: Create, retrieve and cancel customer orders.
  version: 1.4.0
  contact:
    name: Orders Platform Team
    email: orders-platform@acme-retail.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
x-api-id: 6f1c1c0e-2d57-4a7b-9a63-3f6a5d3a41aa
x-audience: company-internal
servers:
  - url: https://api.acme-retail.com
tags:
  - name: orders
    description: Create, retrieve and cancel customer orders.
  - name: shipments
    description: Track the shipment of an order.
security:
  - bearerAuth: [read, write]
paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List customer orders
      description: Returns a page of orders, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create a customer order
      description: Creates an order for the authenticated customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: The order was created.
          headers:
            Location:
              description: URI of the new order.
              schema: { type: string, format: uri, maxLength: 2000 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorised' }
  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get a customer order
      description: Returns one order by its identifier.
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel a customer order
      description: Cancels an order that has not shipped.
      responses:
        '204': { description: The order was cancelled. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shipments/{shipment_id}:
    get:
      tags: [shipments]
      operationId: getShipment
      summary: Get a shipment
      description: Returns the carrier and delivery state of one shipment.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      description: Identifier of the order.
      example: 0b5c1f3e-6e5a-4a8e-8d0b-2f4a9d1c7e11
      schema: { type: string, format: uuid, maxLength: 36 }
    ShipmentId:
      name: shipment_id
      in: path
      required: true
      description: Identifier of the shipment.
      example: 7d2e9a40-3b1c-4c55-9e0a-5a1b6c8f2d33
      schema: { type: string, format: uuid, maxLength: 36 }
    Limit:
      name: limit
      in: query
      description: Maximum number of orders to return.
      example: 25
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      example: eyJvZmZzZXQiOjI1fQ
      schema: { type: string, maxLength: 200 }
    Filter:
      name: filter
      in: query
      description: Filter expression, for example status eq shipped.
      example: status eq shipped
      schema: { type: string, maxLength: 200 }
    Sort:
      name: sort
      in: query
      description: Sort expression, for example created_at desc.
      example: created_at desc
      schema: { type: string, maxLength: 100 }
    Fields:
      name: fields
      in: query
      description: Comma separated list of fields to return.
      example: id,status
      schema: { type: string, maxLength: 200 }
  responses:
    InvalidInput:
      description: The request was invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorised:
      description: Authentication is required.
      headers:
        WWW-Authenticate:
          description: The authentication challenge.
          schema: { type: string, maxLength: 200 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: The order does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Order:
      type: object
      required: [id, status, lines, createdAt]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: Order identifier.
          example: 0b5c1f3e-6e5a-4a8e-8d0b-2f4a9d1c7e11
        status:
          type: string
          description: Lifecycle state of the order, such as PENDING, SHIPPED or CANCELLED.
          example: SHIPPED
          maxLength: 20
        lines:
          type: array
          description: The items ordered.
          example: [{ sku: BOLT-12, quantity: 3 }]
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderLine'
        createdAt:
          type: string
          format: date-time
          description: When the order was placed.
          example: 2026-03-01T09:30:00Z
          maxLength: 40
      example:
        id: 0b5c1f3e-6e5a-4a8e-8d0b-2f4a9d1c7e11
        status: SHIPPED
        lines:
          - sku: BOLT-12
            quantity: 3
        createdAt: 2026-03-01T09:30:00Z
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          description: Stock keeping unit.
          example: BOLT-12
          maxLength: 40
        quantity:
          type: integer
          format: int32
          description: Number of units.
          example: 3
          minimum: 1
          maximum: 999
      example:
        sku: BOLT-12
        quantity: 3
    Shipment:
      type: object
      required: [id, carrier]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: Shipment identifier.
          example: 7d2e9a40-3b1c-4c55-9e0a-5a1b6c8f2d33
        carrier:
          type: string
          description: Name of the carrier.
          example: Parcelway
          maxLength: 80
      example:
        id: 7d2e9a40-3b1c-4c55-9e0a-5a1b6c8f2d33
        carrier: Parcelway
    NewOrder:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          description: The items to order.
          example: [{ sku: BOLT-12, quantity: 3 }]
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderLine'
      example:
        lines:
          - sku: BOLT-12
            quantity: 3
    OrderPage:
      type: object
      required: [items]
      properties:
        nextCursor:
          type: string
          description: Cursor for the next page, absent on the last page.
          example: eyJvZmZzZXQiOjI1fQ
          maxLength: 200
        items:
          type: array
          description: The orders on this page.
          example: []
          maxItems: 100
          items:
            $ref: '#/components/schemas/Order'
      example:
        items: []
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Problem type identifier.
          example: https://api.acme-retail.com/problems/not-found
          maxLength: 2000
        title:
          type: string
          description: Short summary of the problem.
          example: Order not found
          maxLength: 200
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 404
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence.
          example: No order exists with that identifier.
          maxLength: 1000
      example:
        type: https://api.acme-retail.com/problems/not-found
        title: Order not found
        status: 404
        detail: No order exists with that identifier.
